# XcodeGen spec for the standalone watchOS app.
#
# A hand-written project.pbxproj is a few hundred lines of generated-looking
# state that is easy to get subtly wrong and impossible to review; this is the
# same thing in a form you can read. Generate the project with:
#
#   brew install xcodegen && cd watch && xcodegen
#
# There is no iOS companion target: since watchOS 6 a watch app can be wholly
# independent, which is what makes this work without an iPhone in the picture.

name: WristbridgeWatch

options:
  bundleIdPrefix: dev.wristbridge
  deploymentTarget:
    watchOS: "9.0"
  createIntermediateGroups: true

targets:
  WristbridgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/WristbridgeWatch
    info:
      path: Sources/WristbridgeWatch/Info.plist
      properties:
        CFBundleDisplayName: Wristbridge
        CFBundleName: Wristbridge
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Marks this as a single-target, iPhone-independent watch app.
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Shown verbatim in the permission prompts on the watch.
        NSHealthShareUsageDescription: >-
          Wristbridge reads your health data so it can send it to your Android
          phone. Nothing is shared with anyone else.
        NSBluetoothAlwaysUsageDescription: >-
          Wristbridge connects to your Android phone over Bluetooth to carry
          notifications and health data between them.
    entitlements:
      path: WristbridgeWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wristbridge.watch
        INFOPLIST_KEY_CFBundleDisplayName: Wristbridge
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        # Let the signing identity come from whatever Apple ID is set up on the
        # Mac, rather than being pinned to one that will not exist there.
        CODE_SIGN_STYLE: Automatic
